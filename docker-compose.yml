version: "3.9"

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultcorp
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctfpassword
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d vaultcorp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ctf-net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks:
      - ctf-net

  # ── Main API (Node.js) ────────────────────────────────────────────────────
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ctf:ctfpassword@postgres:5432/vaultcorp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ctf_hard_to_guess_secret_2024
      JWT_WEAK_SECRET: secret123
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ctf-net

  # ── Admin API (Python/Flask) ───────────────────────────────────────────────
  admin-api:
    build: ./admin-api
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://ctf:ctfpassword@postgres:5432/vaultcorp
      JWT_SECRET: ctf_hard_to_guess_secret_2024
      PORT: 8001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ctf-net

  # ── Scoreboard (Node.js) ──────────────────────────────────────────────────
  scoreboard:
    build: ./scoreboard
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
    networks:
      - ctf-net

  # ── Frontend (React + Vite) ────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_ADMIN_API_URL: http://localhost:8001
    networks:
      - ctf-net

networks:
  ctf-net:
    driver: bridge
